[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loupedeckapp"
version = "0.5.0"
description = "Linux configuration app for the Loupedeck CT, Live and Live S"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "JM" }]
keywords = ["loupedeck", "streamdeck", "wayland", "kde", "macropad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# Lower bounds, not pins: these are the versions the app is developed against
# and the oldest known to work. A distro package or a Flatpak runtime will
# supply its own, and pinning exactly would fight both.
dependencies = [
    "PySide6>=6.5",
    "pyserial>=3.5",
    "Pillow>=9.0",
    # Device I/O. Not on PyPI, so it is not resolvable from here; see the
    # README for the install line, or use the [dev] extra below.
]

[project.optional-dependencies]
# The device library, installed straight from git.
device = [
    "loupedeck @ git+https://github.com/devleaks/python-loupedeck-live.git",
]
# X11 input fallback. Unnecessary on Wayland, where ydotool does the work.
x11 = ["pyautogui>=0.9.53", "python-xlib>=0.33"]

[project.urls]
Homepage = "https://github.com/ascendedent/loupedeckapp"
Issues = "https://github.com/ascendedent/loupedeckapp/issues"

[project.gui-scripts]
loupedeckapp = "qml_app:main"

[tool.setuptools]
# Flat layout: the modules sit at the repo root rather than in a package dir.
# This list has to be kept in step by hand, and a module missing from it does
# not fail the build: it fails at first import, on someone else's machine.
# tests/test_packaging.py compares it against what the app actually imports.
py-modules = [
    "qml_app",
    "device_controller",
    "device_lib",
    "LdConfiguration",
    "DeviceProfile",
    "ct_support",
    "label_render",
    "input_backend",
    "window_watcher",
    "profile_manager",
    "system_shortcuts",
    "platform_env",
    "action_library",
    "app_paths",
    "macro",
    "tray",
    "settings",
    "virtual_keyboard",
]

# Flat module layout means there is no package for package-data to attach to,
# so the assets install as data files under the prefix instead. app_paths looks
# for them beside the code first (running from a checkout) and falls back here.
# Listed file by file, not globbed. A glob ships whatever happens to be in the
# working tree, so a build made on a machine with local profiles lying around
# put those in the wheel, one of them referencing an image outside the repo.
# tests/test_packaging.py checks every path here is a tracked file.
[tool.setuptools.data-files]
"share/loupedeckapp/qml" = [
    "qml/Main.qml",
    "qml/DeviceView.qml",
]
"share/loupedeckapp/Images" = [
    "Images/emoji_laugh.png",
    "Images/emoji_laugh_90x90.png",
    "Images/submenu_back_button.png",
]
"share/loupedeckapp/Profiles" = ["Profiles/testbothactions.json"]
"share/applications" = ["packaging/loupedeckapp.desktop"]
"share/icons/hicolor/scalable/apps" = ["packaging/icons/loupedeckapp.svg"]
