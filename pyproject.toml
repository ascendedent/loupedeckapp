[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loupedeckapp"
version = "0.5.0"
description = "Linux and macOS configuration app for the Loupedeck CT, Live and Live S"
readme = "README.md"
requires-python = ">=3.9"
# SPDX string plus an explicit file list: setuptools deprecated the table form
# and warns on every build, including inside a distribution package build.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "JM" }]
keywords = ["loupedeck", "streamdeck", "wayland", "kde", "macos", "macropad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# Lower bounds, not pins: these are the versions the app is developed against
# and the oldest known to work. A distro package or a Flatpak runtime will
# supply its own, and pinning exactly would fight both.
dependencies = [
    # 6.2 rather than 6.5 because that is the last release macOS 10.14 can run,
    # and the suite passes against it. Nothing here needs a newer Qt: the two
    # places that did (MultiEffect, QtQuick.Dialogs' ColorDialog) now use the
    # spellings that exist in both. Anything modern still resolves to latest.
    "PySide6>=6.2",
    "pyserial>=3.5",
    "Pillow>=9.0",
    # Device I/O. Not on PyPI, so it is not resolvable from here; see the
    # README for the install line, or use the [dev] extra below.
]

[project.optional-dependencies]
# The device library, installed straight from git. It declares requires-python
# >=3.10, so this extra is the one thing here that will not install on 3.9: the
# app itself runs there, minus the hardware, which is what device_lib is for.
device = [
    "loupedeck @ git+https://github.com/devleaks/python-loupedeck-live.git",
]
# X11 input fallback. Unnecessary on Wayland, where ydotool does the work.
x11 = ["pyautogui>=0.9.53", "python-xlib>=0.33"]
# macOS: real media keys and real scrolling. AppleScript can reach neither, so
# without this a media action does nothing and a scroll sends arrow keys.
macos = ["pyobjc-framework-Quartz>=9.0", "pyobjc-framework-Cocoa>=9.0"]
# macOS 10.14 and 10.15. Qt 6.2 is the last one Apple's older frameworks can
# load, and it is also the last PySide6 whose wheel says so: 6.3 through 6.5.2
# are tagged macosx_10_9 but need 10.15 or 11 at runtime, so pip installs them
# on Mojave quite happily and the app then fails to start. Asking for this
# extra is the only way to get a Qt that actually runs there. Caps Python at
# 3.10, which is the newest that release built wheels for.
legacy-macos = ["PySide6>=6.2,<6.3"]

[project.urls]
Homepage = "https://github.com/ascendedent/loupedeckapp"
Issues = "https://github.com/ascendedent/loupedeckapp/issues"

[project.gui-scripts]
loupedeckapp = "qml_app:main"

[tool.setuptools]
# Flat layout: the modules sit at the repo root rather than in a package dir.
# This list has to be kept in step by hand, and a module missing from it does
# not fail the build: it fails at first import, on someone else's machine.
# tests/test_packaging.py compares it against what the app actually imports.
py-modules = [
    "qml_app",
    "device_controller",
    "device_lib",
    "LdConfiguration",
    "DeviceProfile",
    "ct_support",
    "label_render",
    "input_backend",
    "installed_apps",
    "window_watcher",
    "profile_manager",
    "profile_store",
    "system_shortcuts",
    "platform_env",
    "action_library",
    "app_paths",
    "autostart",
    "macro",
    "tray",
    "settings",
    "setup_check",
    "virtual_keyboard",
]

# Flat module layout means there is no package for package-data to attach to,
# so the assets install as data files under the prefix instead. app_paths looks
# for them beside the code first (running from a checkout) and falls back here.
# Listed file by file, not globbed. A glob ships whatever happens to be in the
# working tree, so a build made on a machine with local profiles lying around
# put those in the wheel, one of them referencing an image outside the repo.
# tests/test_packaging.py checks every path here is a tracked file.
[tool.setuptools.data-files]
"share/loupedeckapp/qml" = [
    "qml/Main.qml",
    "qml/DeviceView.qml",
]
"share/loupedeckapp/Images" = [
    "Images/emoji_laugh.png",
    "Images/emoji_laugh_90x90.png",
    "Images/submenu_back_button.png",
]
# Profiles live inside an application folder now; the shipped ones belong to
# the default app.
"share/loupedeckapp/Profiles/Default" = [
    "Profiles/Default/Starter.json",
    "Profiles/Default/testbothactions.json",
]
# A ready-made deck for an application people actually use, and a worked
# example of what a finished profile looks like.
"share/loupedeckapp/Profiles/Visual Studio Code" = [
    "Profiles/Visual Studio Code/app.json",
    "Profiles/Visual Studio Code/Visual Studio Code.json",
]
# setup_check points at these by path, so an install that leaves them out
# tells the user to copy a file that is not there.
"share/loupedeckapp/packaging" = [
    "packaging/99-loupedeck.rules",
    "packaging/ydotool-user-socket.conf",
]
# The tray looks the icon up by file path first. Installed from a wheel the
# hicolor copy below is not somewhere the app can find by itself, and the tray
# came up with no icon at all.
"share/loupedeckapp/packaging/icons" = ["packaging/icons/loupedeckapp.svg"]
"share/applications" = ["packaging/loupedeckapp.desktop"]
"share/icons/hicolor/scalable/apps" = ["packaging/icons/loupedeckapp.svg"]
