# Drop-in for the system ydotool.service.
#
# ydotoold must stay root to open /dev/uinput, but the *socket* has to be
# reachable by the desktop user or the app cannot ask it to type anything. This
# puts the socket somewhere predictable and hands it to uid 1000.
#
# Install (adjust the uid if yours is not 1000):
#   sudo mkdir -p /etc/systemd/system/ydotool.service.d
#   sudo cp packaging/ydotool-user-socket.conf \
#           /etc/systemd/system/ydotool.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl enable --now ydotool
#
# input_backend discovers this path automatically; no environment variable is
# needed.

[Service]
ExecStart=
ExecStart=/usr/bin/ydotoold --socket-path=/run/.ydotool_socket --socket-own=1000:1000
